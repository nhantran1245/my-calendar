name: Publish Android APK

on:
  release:
    types: [published]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle distributions
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-8.8-all

      - name: Pre-download Gradle 8.8
        run: |
          curl --retry 5 --retry-delay 5 --connect-timeout 30 -L \
            https://services.gradle.org/distributions/gradle-8.8-all.zip \
            -o /tmp/gradle-8.8-all.zip

      - name: Build APK
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.http.connectionTimeout=60000"
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --local \
            --output ../build/my-calendar-${{ github.event.release.tag_name }}.apk

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            build/my-calendar-${{ github.event.release.tag_name }}.apk
