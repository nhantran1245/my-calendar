name: Publish Android APK

on:
  release:
    types: [published]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pre-download Gradle 8.8 into global cache
        run: |
          GRADLE_URL="https://services.gradle.org/distributions/gradle-8.8-all.zip"
          # Hash is MD5 of the URL encoded as base-36 (Gradle wrapper's PathAssembler algorithm)
          HASH="6gdy1pgp427xkqcjbxw3ylt6h"
          DEST="$HOME/.gradle/wrapper/dists/gradle-8.8-all/$HASH"
          mkdir -p "$DEST"

          curl --retry 5 --retry-delay 10 --connect-timeout 60 --max-time 300 -L \
            "$GRADLE_URL" -o "$DEST/gradle-8.8-all.zip"

          # Mark as downloaded so wrapper skips re-download
          touch "$DEST/gradle-8.8-all.zip.ok"

      - name: Build APK
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          GRADLE_USER_HOME: /home/runner/.gradle
          GRADLE_OPTS: "-Xmx4096m -Dorg.gradle.daemon=false"
          EAS_BUILD_SKIP_DOCTOR: "1"
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --local \
            --output ../build/my-calendar-${{ github.event.release.tag_name }}.apk

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            build/my-calendar-${{ github.event.release.tag_name }}.apk
