name: Publish Backend Image

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-calendar-backend:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/my-calendar-backend:latest

      - name: Build and push flyway
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-calendar-flyway:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/my-calendar-flyway:latest
