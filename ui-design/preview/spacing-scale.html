<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body { min-height: 360px; }</style>
</head>
<body>

<div class="col" style="gap:8px">
  
    <div class="row" style="gap:14px; align-items:center">
      <div class="t-mono" style="width:60px; font-size:12px">--space-0</div>
      <div style="height:14px; width:0px; background:var(--accent); border-radius:2px"></div>
      <div class="label" style="font-size:11px">0px</div>
    </div>
  
    <div class="row" style="gap:14px; align-items:center">
      <div class="t-mono" style="width:60px; font-size:12px">--space-1</div>
      <div style="height:14px; width:4px; background:var(--accent); border-radius:2px"></div>
      <div class="label" style="font-size:11px">4px</div>
    </div>
  
    <div class="row" style="gap:14px; align-items:center">
      <div class="t-mono" style="width:60px; font-size:12px">--space-2</div>
      <div style="height:14px; width:8px; background:var(--accent); border-radius:2px"></div>

      <div style="height:14px; width:16px; background:var(--accent); border-radius:2px"></div>
      <div class="label" style="font-size:11px">16px</div>
    </div>
  
    <div class="row" style="gap:14px; align-items:center">
      <div class="t-mono" style="width:60px; font-size:12px">--space-5</div>
      <div style="height:14px; width:24px; background:var(--accent); border-radius:2px"></div>
      <div class="label" style="font-size:11px">24px</div>
    </div>
  
    <div class="row" style="gap:14px; align-items:center">

      <div class="t-mono" style="width:60px; font-size:12px">--space-8</div>
      <div style="height:14px; width:64px; background:var(--accent); border-radius:2px"></div>
      <div class="label" style="font-size:11px">64px</div>
    </div>

      <div class="t-mono" style="width:60px; font-size:12px">--space-9</div>
