<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body { min-height: 220px; }</style>
</head>
<body>

<style>
  .field { display:flex; flex-direction:column; gap:6px; max-width:320px }
  .field-label { font-family:var(--font-sans); font-size:13px; color:var(--fg-2); font-weight:500 }
  .input {
    height:36px; padding:0 12px; border-radius:6px;
    border:1px solid var(--border); background:var(--bg-0);
    color:var(--fg-0); font-family:var(--font-sans); font-size:15px;
    transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  .input::placeholder { color:var(--fg-3) }
  .input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint) }
  .input.error { border-color:var(--clay-500) }
  .help { font-family:var(--font-sans); font-size:12px; color:var(--fg-2) }
  .help.error { color:var(--clay-500) }
</style>
<div class="row" style="gap:24px; align-items:flex-start">
  <div class="field">
    <label class="field-label">Title</label>
    <input class="input" value="Coffee with Mira"/>
  </div>
  <div class="field">
    <label class="field-label">Starts</label>
    <input class="input" placeholder="Fri 3pm"/>
    <div class="help">Try “tomorrow 9am” or “next Tue”</div>
  </div>
  <div class="field">
    <label class="field-label">Location</label>
    <input class="input error" value="zoom.us/j/—"/>
    <div class="help error">That doesn't look like a Zoom link.</div>
  </div>
</div>
<div class="label" style="margin-top:14px">Inputs — 36px tall, 1px border, accent ring on focus. Inline help &amp; error in sentence case.</div>

</body>
</html>
