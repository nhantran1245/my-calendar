<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body { min-height: 200px; }</style>
</head>
<body>

<div class="row" style="gap:32px; align-items:center">
  <div style="text-align:center">
    <div style="width:96px; height:96px; background:var(--slate-12); border-radius:22px; position:relative; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-md)">
      <div style="font-family:var(--font-serif); font-size:72px; color:var(--slate-0); line-height:1">c</div>
      <div style="position:absolute; top:18px; right:18px; width:10px; height:10px; background:var(--accent); border-radius:999px"></div>
    </div>
    <div class="label" style="margin-top:10px">Dark</div>
  </div>
  <div style="text-align:center">
    <div style="width:96px; height:96px; background:var(--slate-0); border:1px solid var(--border); border-radius:22px; position:relative; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-md)">
      <div style="font-family:var(--font-serif); font-size:72px; color:var(--slate-12); line-height:1">c</div>
      <div style="position:absolute; top:18px; right:18px; width:10px; height:10px; background:var(--accent); border-radius:999px"></div>
    </div>
    <div class="label" style="margin-top:10px">Light</div>
  </div>
  <div style="text-align:center">
    <div style="width:48px; height:48px; background:var(--slate-12); border-radius:11px; position:relative; display:flex; align-items:center; justify-content:center">
      <div style="font-family:var(--font-serif); font-size:36px; color:var(--slate-0); line-height:1">c</div>
      <div style="position:absolute; top:9px; right:9px; width:5px; height:5px; background:var(--accent); border-radius:999px"></div>
    </div>
    <div class="label" style="margin-top:10px">Favicon</div>
  </div>
</div>
<div class="label" style="margin-top:22px">App icon — lowercase serif "c" on slate-12 (or 0). Ember pip top-right, always.</div>

</body>
</html>
