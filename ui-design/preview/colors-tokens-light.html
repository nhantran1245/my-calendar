<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body { min-height: 280px; }</style>
</head>
<body>

<div class="col" style="gap:8px">
  <div class="row" style="gap:8px">
    <div style="width:120px; padding:12px; background:var(--bg-page); border:1px solid var(--border-subtle); border-radius:8px"><div class="t-mono" style="font-size:11px">bg-page</div></div>
    <div style="width:120px; padding:12px; background:var(--bg-0); border:1px solid var(--border-subtle); border-radius:8px"><div class="t-mono" style="font-size:11px">bg-0</div></div>
    <div style="width:120px; padding:12px; background:var(--bg-1); border:1px solid var(--border-subtle); border-radius:8px"><div class="t-mono" style="font-size:11px">bg-1</div></div>
    <div style="width:120px; padding:12px; background:var(--bg-2); border:1px solid var(--border-subtle); border-radius:8px"><div class="t-mono" style="font-size:11px">bg-2</div></div>
  </div>
  <div class="row" style="gap:14px; padding:12px 0 0">
    <div><span style="display:inline-block; width:14px; height:14px; background:var(--fg-0); border-radius:3px; vertical-align:middle"></span> <span class="t-caption" style="color:var(--fg-0)">fg-0 primary</span></div>
    <div><span style="display:inline-block; width:14px; height:14px; background:var(--fg-1); border-radius:3px; vertical-align:middle"></span> <span class="t-caption" style="color:var(--fg-1)">fg-1 body</span></div>
    <div><span style="display:inline-block; width:14px; height:14px; background:var(--fg-2); border-radius:3px; vertical-align:middle"></span> <span class="t-caption" style="color:var(--fg-2)">fg-2 muted</span></div>
    <div><span style="display:inline-block; width:14px; height:14px; background:var(--fg-3); border-radius:3px; vertical-align:middle"></span> <span class="t-caption" style="color:var(--fg-3)">fg-3 placeholder</span></div>
  </div>
  <div class="row" style="gap:14px">
    <div><span style="display:inline-block; width:14px; height:14px; background:var(--accent); border-radius:3px; vertical-align:middle"></span> <span class="t-caption">accent</span></div>
    <div><span style="display:inline-block; width:14px; height:14px; background:var(--border); border-radius:3px; vertical-align:middle"></span> <span class="t-caption">border</span></div>
    <div><span style="display:inline-block; width:14px; height:14px; background:var(--accent-tint); border-radius:3px; vertical-align:middle; border:1px solid var(--border-subtle)"></span> <span class="t-caption">accent-tint</span></div>
  </div>
</div>
<div class="label" style="margin-top:14px">Light theme semantic tokens. Components reference these, not raw palette values.</div>

</body>
</html>
