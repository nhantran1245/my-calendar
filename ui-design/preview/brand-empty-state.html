<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body { min-height: 220px; }</style>
</head>
<body>

<div class="row" style="gap:24px; align-items:center">
  <div style="color:var(--fg-2); flex-shrink:0">
    <svg width="180" height="130" viewBox="0 0 280 200" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="40" y="40" width="200" height="140" rx="12"/>
      <line x1="40" y1="76" x2="240" y2="76"/>
      <line x1="74" y1="40" x2="74" y2="32"/>
      <line x1="206" y1="40" x2="206" y2="32"/>
      <line x1="68" y1="76" x2="68" y2="180" opacity="0.4"/>
      <line x1="106" y1="76" x2="106" y2="180" opacity="0.4"/>
      <line x1="144" y1="76" x2="144" y2="180" opacity="0.4"/>
      <line x1="182" y1="76" x2="182" y2="180" opacity="0.4"/>
      <line x1="220" y1="76" x2="220" y2="180" opacity="0.4"/>
      <line x1="40" y1="110" x2="240" y2="110" opacity="0.4"/>
      <line x1="40" y1="144" x2="240" y2="144" opacity="0.4"/>
      <circle cx="125" cy="127" r="4" fill="#E26D4D" stroke="none"/>
    </svg>
  </div>
  <div style="flex:1">
    <div class="t-h3" style="margin-bottom:6px">Nothing on the books for Thursday.</div>
    <div class="t-body-sm" style="color:var(--fg-2)">Add an event with <span class="t-mono" style="font-size:12px; padding:1px 6px; background:var(--bg-1); border-radius:4px">⌘ N</span>, or drag time on the grid.</div>
  </div>
</div>
<div class="label" style="margin-top:14px">Empty state — thin-line motif, single ember dot, quiet copy. The only illustration in product UI.</div>

</body>
</html>
