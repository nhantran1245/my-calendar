<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body { min-height: 180px; }</style>
</head>
<body>

<style>
  .chip {
    display:flex; flex-direction:column; gap:2px;
    padding:6px 8px; border-radius:6px;
    font-family:var(--font-sans); font-size:13px; line-height:1.25;
    border-left:3px solid;
  }
  .chip .time { font-family:var(--font-mono); font-size:11px; opacity:0.75 }
</style>
<div class="row" style="gap:10px; flex-wrap:wrap">
  <div class="chip" style="background:var(--accent-tint); color:var(--ember-800); border-color:var(--ember-500); min-width:160px">
    <div style="font-weight:500">Coffee with Mira</div>
    <div class="time">9:30 – 10:00am</div>
  </div>
  <div class="chip" style="background:var(--info-tint); color:var(--steel-700); border-color:var(--steel-500); min-width:160px">
    <div style="font-weight:500">Engineering standup</div>
    <div class="time">10:30 – 10:45am</div>
  </div>
  <div class="chip" style="background:var(--success-tint); color:var(--sage-700); border-color:var(--sage-500); min-width:160px">
    <div style="font-weight:500">Lunch run</div>
    <div class="time">12:30 – 1:30pm</div>
  </div>
  <div class="chip" style="background:var(--warning-tint); color:var(--amber-700); border-color:var(--amber-500); min-width:160px">
    <div style="font-weight:500">Lease deadline</div>
    <div class="time">All day</div>
  </div>
</div>
<div class="label" style="margin-top:14px">Event chips — calendar-tinted capsule + 3px left bar. Four hue families map to user-chosen calendars.</div>

</body>
</html>
