<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body { min-height: 200px; }</style>
</head>
<body>

<div class="split" style="gap:12px">
  <div style="background:var(--success-tint); color:var(--success); padding:14px 16px; border-radius:8px; font-family:var(--font-sans); font-size:14px; font-weight:500">Saved to your calendar</div>
  <div style="background:var(--warning-tint); color:var(--warning); padding:14px 16px; border-radius:8px; font-family:var(--font-sans); font-size:14px; font-weight:500">Conflicts with standup</div>
  <div style="background:var(--danger-tint); color:var(--danger); padding:14px 16px; border-radius:8px; font-family:var(--font-sans); font-size:14px; font-weight:500">Couldn't reach Google</div>
  <div style="background:var(--info-tint); color:var(--info); padding:14px 16px; border-radius:8px; font-family:var(--font-sans); font-size:14px; font-weight:500">Synced 2 minutes ago</div>
</div>
<div class="label" style="margin-top:14px">Semantic colors — sage, amber, clay, steel. Tinted backgrounds + darker text, never raw saturated fills.</div>

</body>
</html>
