<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body { min-height: 180px; }</style>
</head>
<body>

<div style="background:var(--bg-0); border:1px solid var(--border); border-radius:10px; padding:16px; max-width:420px">
  <div class="row" style="gap:12px; align-items:flex-start">
    <div style="width:4px; align-self:stretch; background:var(--accent); border-radius:2px"></div>
    <div style="flex:1; min-width:0">
      <div class="t-ui" style="margin-bottom:4px">Coffee with Mira</div>
      <div class="t-mono" style="color:var(--fg-2)">9:30am – 10:00am</div>
      <div class="t-caption" style="margin-top:8px; color:var(--fg-2)">Verve · 4th & Mission</div>
    </div>
  </div>
</div>
<div class="label" style="margin-top:14px">Spacing in use — outer padding space-4 (16px), gap space-3 (12px), inner gap space-1 (4px) and space-2 (8px).</div>

</body>
</html>
