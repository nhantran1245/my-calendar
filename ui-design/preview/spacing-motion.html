<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body { min-height: 280px; }</style>
</head>
<body>

<style>
  .demo-box { width:48px; height:48px; background:var(--accent); border-radius:8px; }
  @keyframes slide-out { 0% { transform:translateX(0) } 50% { transform:translateX(220px) } 100% { transform:translateX(0) } }
  .anim-fast { animation: slide-out 2s var(--ease-out) infinite }
  .anim-base { animation: slide-out 2.7s var(--ease-out) infinite }
  .anim-slow { animation: slide-out 3.4s var(--ease-out) infinite }
</style>
<div class="col" style="gap:14px">
  <div class="row" style="gap:14px">
    <div style="width:160px"><div class="t-mono" style="font-size:11px">--dur-fast 150ms</div><div class="label" style="font-size:11px">hover, press</div></div>
    <div style="flex:1; height:48px; position:relative"><div class="demo-box anim-fast"></div></div>
  </div>
  <div class="row" style="gap:14px">
    <div style="width:160px"><div class="t-mono" style="font-size:11px">--dur-base 220ms</div><div class="label" style="font-size:11px">sheet, panel slide</div></div>
    <div style="flex:1; height:48px; position:relative"><div class="demo-box anim-base"></div></div>
  </div>
  <div class="row" style="gap:14px">
    <div style="width:160px"><div class="t-mono" style="font-size:11px">--dur-slow 320ms</div><div class="label" style="font-size:11px">view transitions</div></div>
    <div style="flex:1; height:48px; position:relative"><div class="demo-box anim-slow"></div></div>
  </div>
</div>
<div class="label" style="margin-top:14px">Easing: <span class="t-mono" style="font-size:11px">cubic-bezier(0.32, 0.72, 0, 1)</span> — settles, never overshoots.</div>

</body>
</html>
