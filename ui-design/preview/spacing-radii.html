<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body { min-height: 180px; }</style>
</head>
<body>

<div class="row" style="gap:16px; flex-wrap:nowrap; align-items:flex-end">
  
    <div style="text-align:center">
      <div style="width:80px; height:80px; background:var(--bg-1); border:1px solid var(--border-subtle); border-radius:4px"></div>
      <div class="t-mono" style="font-size:11px; margin-top:6px">--radius-xs</div>
      <div class="label" style="font-size:11px">4px</div>
    </div>
    <div style="text-align:center">
      <div style="width:80px; height:80px; background:var(--bg-1); border:1px solid var(--border-subtle); border-radius:6px"></div>
      <div class="t-mono" style="font-size:11px; margin-top:6px">--radius-sm</div>
      <div class="label" style="font-size:11px">6px</div>
    </div>
    <div style="text-align:center">
      <div style="width:80px; height:80px; background:var(--bg-1); border:1px solid var(--border-subtle); border-radius:10px"></div>
      <div class="t-mono" style="font-size:11px; margin-top:6px">--radius-md</div>
      <div class="label" style="font-size:11px">10px</div>
    </div>
    <div style="text-align:center">
      <div style="width:80px; height:80px; background:var(--bg-1); border:1px solid var(--border-subtle); border-radius:16px"></div>
      <div class="t-mono" style="font-size:11px; margin-top:6px">--radius-lg</div>
      <div class="label" style="font-size:11px">16px</div>
    </div>
    <div style="text-align:center">
      <div style="width:80px; height:80px; background:var(--bg-1); border:1px solid var(--border-subtle); border-radius:24px"></div>
      <div class="t-mono" style="font-size:11px; margin-top:6px">--radius-xl</div>
      <div class="label" style="font-size:11px">24px</div>
    </div>
  <div style="text-align:center">
    <div style="width:80px; height:80px; background:var(--bg-1); border:1px solid var(--border-subtle); border-radius:999px"></div>
    <div class="t-mono" style="font-size:11px; margin-top:6px">--radius-full</div>
    <div class="label" style="font-size:11px">999px</div>
  </div>
</div>
<div class="label" style="margin-top:14px">Radii in use: xs chips · sm buttons · md cards · lg modals · full avatars.</div>

</body>
</html>
