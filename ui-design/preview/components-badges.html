<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body { min-height: 130px; }</style>
</head>
<body>

<style>
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-family:var(--font-sans); font-size:12px; font-weight:500; line-height:1 }
  .dot { width:6px; height:6px; border-radius:999px; background:currentColor }
</style>
<div class="row" style="gap:10px; flex-wrap:wrap">
  <span class="pill" style="background:var(--accent-tint); color:var(--ember-700)"><span class="dot"></span> today</span>
  <span class="pill" style="background:var(--bg-1); color:var(--fg-1)">tomorrow</span>
  <span class="pill" style="background:var(--bg-1); color:var(--fg-2)">this week</span>
  <span class="pill" style="background:var(--success-tint); color:var(--sage-700)"><span class="dot"></span> confirmed</span>
  <span class="pill" style="background:var(--warning-tint); color:var(--amber-700)"><span class="dot"></span> tentative</span>
  <span class="pill" style="background:var(--danger-tint); color:var(--clay-700)"><span class="dot"></span> declined</span>
  <span class="pill" style="background:var(--info-tint); color:var(--steel-700)">recurring</span>
</div>
<div class="label" style="margin-top:14px">Pills — relative-time chips &amp; RSVP status. Always lowercase, 12px Medium, fully rounded.</div>

</body>
</html>
