<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body { min-height: 200px; }</style>
</head>
<body>

<div class="row" style="gap:24px; flex-wrap:nowrap; padding:20px 8px">
  
    <div style="text-align:center; flex:1">
      <div style="width:100%; height:80px; background:var(--bg-0); border-radius:10px; box-shadow:var(--shadow-sm)"></div>
      <div class="t-mono" style="font-size:11px; margin-top:10px">--shadow-sm</div>
      <div class="label" style="font-size:11px">today pip</div>
    </div>
    <div style="text-align:center; flex:1">
      <div style="width:100%; height:80px; background:var(--bg-0); border-radius:10px; box-shadow:var(--shadow-md)"></div>
      <div class="t-mono" style="font-size:11px; margin-top:10px">--shadow-md</div>
      <div class="label" style="font-size:11px">popover</div>
    </div>
    <div style="text-align:center; flex:1">
      <div style="width:100%; height:80px; background:var(--bg-0); border-radius:10px; box-shadow:var(--shadow-lg)"></div>
      <div class="t-mono" style="font-size:11px; margin-top:10px">--shadow-lg</div>
      <div class="label" style="font-size:11px">modal sheet</div>
    </div>
</div>
<div class="label" style="margin-top:6px">Three soft, warm-tinted shadows. Never pure black; always slate-warmed.</div>

</body>
</html>
